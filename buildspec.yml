version: 0.2

phases:
  install:
    commands:
      - echo "Installing dependencies (none needed for static HTML)"
  build:
    commands:
      - echo "Build phase - validating files"
      - test -f index.html && echo "index.html found" || exit 1
      - test -f appspec.yml && echo "appspec.yml found" || exit 1

artifacts:
  files:
    - '**/*'